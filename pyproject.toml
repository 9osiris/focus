[project]
name = "focus"
version = "1.2.0"
description = "salience-based context assembly for agent prompts"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "osiris"}]
keywords = ["agents", "llm", "context", "retrieval", "salience"]

[project.scripts]
focus = "focus.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["focus*"]
